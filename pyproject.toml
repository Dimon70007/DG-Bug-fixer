[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-fixer"
version = "3.1.0"
description = "Five-phase debugging skill: reproduce, route, research, probe one named hypothesis at a time, decide."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dimon70007" }]
# The skill itself is stdlib-only: a plugin that needs a wheel installed before it can run
# is a plugin that fails on the first machine without network access.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin's tests import ``bugfixer_helpers`` from their own directory, the way pytest's
# rootdir-insertion does; naming it explicitly keeps that true under any invocation.
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
# The suite exercises the gate and the CLI through `subprocess`, which a plain `--cov` run cannot
# see: every `main()` path looked uncovered while being tested. Patch mode makes the child
# processes report their own coverage, so a changed-line number means what §11a says it means.
patch = ["subprocess"]
parallel = true
# `bin/bugfixer` has no `.py` suffix, so a `source` listing alone never measures it — and it is
# the file every verb passes through. §11a counts changed lines, so leaving it out made the
# reported number describe everything except the change. `scripts/` holds the measurer itself,
# which is code like any other: it has tests, so it gets measured.
source = ["hooks", "lib", "bin", "scripts"]
include = ["bin/bugfixer"]

[tool.coverage.report]
omit = ["tests/*", "logs/*"]
